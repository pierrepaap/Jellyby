name: release-image

# Builds a ready-to-flash Jellyby image (Pi OS Lite 64-bit + setup.sh run in a
# chroot under qemu-user-static), shrinks it, and attaches the image plus a
# Raspberry Pi Imager custom-repo JSON to the published GitHub Release.
#
# Single trigger: publishing a release (Releases -> New release -> Publish).
# The lint workflow still runs on every PR/push and gates merges; image builds
# are deliberately release-driven so each image maps to a versioned release.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo bash scripts/ci-apt.sh qemu-user-static binfmt-support parted e2fsprogs xz-utils curl openssl cloud-guest-utils
          test -x /usr/bin/qemu-aarch64-static   # guard: apt must not have skipped it

      - name: Download Raspberry Pi OS Lite (64-bit, latest)
        run: |
          curl -fL -o base.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64_latest
          xz -d -k base.img.xz

      - name: Grow image by 8G for the in-image apt install (pishrink shrinks it back at the end)
        run: |
          truncate -s +8G base.img
          LOOP=$(sudo losetup -fP --show base.img)
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo growpart "$LOOP" 2
          sudo partprobe "$LOOP"
          sudo e2fsck -fy "${LOOP}p2"
          sudo resize2fs "${LOOP}p2"

      - name: Mount image partitions
        run: |
          sudo mkdir -p /mnt/jb-boot /mnt/jb-root
          sudo mount "${LOOP}p1" /mnt/jb-boot
          sudo mount "${LOOP}p2" /mnt/jb-root

      - name: First-boot settings on the boot partition (SSH, default user)
        run: |
          sudo touch /mnt/jb-boot/ssh
          echo "pi:$(openssl passwd -6 jellyby)" | sudo tee /mnt/jb-boot/userconf.txt
          # config.txt itself (KMS/gpu_mem/splash) is written by setup.sh via the bind mount below

      - name: Run setup.sh in chroot (ARM64 under qemu-user-static)
        run: |
          sudo cp -L /etc/resolv.conf /mnt/jb-root/etc/resolv.conf
          sudo cp /usr/bin/qemu-aarch64-static /mnt/jb-root/usr/bin/
          sudo mount --bind /dev /mnt/jb-root/dev
          sudo mount --bind /proc /mnt/jb-root/proc
          sudo mount --bind /sys /mnt/jb-root/sys
          sudo mkdir -p /mnt/jb-root/boot/firmware
          sudo mount --bind /mnt/jb-boot /mnt/jb-root/boot/firmware
          sudo mkdir -p /mnt/jb-root/root/Jellyby
          git archive HEAD | sudo tar -x -C /mnt/jb-root/root/Jellyby
          sudo chroot /mnt/jb-root /usr/bin/qemu-aarch64-static /bin/bash -c \
            "cd /root/Jellyby && JELLYBY_OFFLINE=1 ./setup.sh"
          sudo umount /mnt/jb-root/boot/firmware
          sudo rm -rf /mnt/jb-root/root/Jellyby /mnt/jb-root/usr/bin/qemu-aarch64-static
          sudo sync

      - name: Unmount image
        run: |
          sudo umount /mnt/jb-root/dev /mnt/jb-root/proc /mnt/jb-root/sys
          sudo umount /mnt/jb-root /mnt/jb-boot
          sudo losetup -d "$LOOP"

      - name: Shrink image with pishrink (auto-expand on first boot), fallback to unshrunk
        run: |
          curl -fL -o pishrink.sh https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
          if ! sudo bash pishrink.sh base.img jellyby-pi4.img; then
            echo "pishrink failed, using unshrunk image"
            cp base.img jellyby-pi4.img
          fi
          xz -T0 -9 -k jellyby-pi4.img
          ls -lh jellyby-pi4.img.xz

      - name: Free disk space (the smoke test copies the image and resizes the copy to 8G)
        run: |
          rm -f base.img base.img.xz pishrink.sh
          df -h /

      - name: Hard image checks (no boot; these gate the release)
        run: sudo bash scripts/check-image.sh jellyby-pi4.img

      - name: Smoke-test boot in QEMU (best-effort, non-fatal; boot is validated on hardware)
        run: |
          sudo bash scripts/ci-apt.sh qemu-system-arm qemu-utils sshpass device-tree-compiler
          command -v qemu-system-aarch64 >/dev/null && command -v sshpass >/dev/null
          if sudo bash scripts/test-image-qemu.sh jellyby-pi4.img 2222; then
            echo "QEMU boot smoke passed"
          else
            echo "::warning::QEMU boot smoke did not pass (emulated Pi boot is best-effort; raspi4b has no emulated networking). Validate the boot on real hardware."
          fi

      - name: Upload QEMU console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-console-log
          path: qemu-console.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package PINN repository assets (os_list_v3.json + partition tarballs)
        run: |
          mkdir -p pinn-out /mnt/pb /mnt/pr
          LOOP2=$(sudo losetup -fP --show jellyby-pi4.img)
          sudo mount "${LOOP2}p1" /mnt/pb
          sudo mount "${LOOP2}p2" /mnt/pr
          BOOT_MIB=$(sudo du -sm /mnt/pb | cut -f1)
          ROOT_MIB=$(sudo du -sm /mnt/pr | cut -f1)
          sudo tar -cJf pinn-out/boot.tar.xz --exclude='lost+found' -C /mnt/pb .
          sudo tar -cJf pinn-out/rootfs.tar.xz --exclude='lost+found' -C /mnt/pr .
          sudo umount /mnt/pb /mnt/pr
          sudo losetup -d "$LOOP2"
          python3 scripts/gen-pinn.py \
            --out pinn-out \
            --boot-tar pinn-out/boot.tar.xz \
            --rootfs-tar pinn-out/rootfs.tar.xz \
            --boot-mib "$BOOT_MIB" --root-mib "$ROOT_MIB" \
            --base-url "https://github.com/pierrepaap/Jellyby/releases/latest/download" \
            --date "$(date -u +%Y-%m-%d)" \
            --version "${{ github.event.release.tag_name }}"
          cp pinn/partition_setup.sh pinn-out/
          cp pinn/Jellyby.png pinn-out/
          cp pinn/marketing.tar pinn-out/
          ls -lh pinn-out

      - name: Generate Raspberry Pi Imager custom-repo JSON
        run: |
          SIZE=$(stat -c%s jellyby-pi4.img.xz)
          SHA=$(sha256sum jellyby-pi4.img.xz | cut -d' ' -f1)
          DATE=$(date -u +%Y-%m-%d)
          python3 - "$SIZE" "$SHA" "$DATE" <<'PY'
          import json, sys
          size, sha, date = sys.argv[1], sys.argv[2], sys.argv[3]
          doc = {"os_list": [{
            "name": "Jellyby (Raspberry Pi 4)",
            "description": "Kiosk launcher for Emby / Jellyfin / Plex over HDMI-CEC remote + readsb ADS-B. SSH enabled, default login pi / jellyby (change it).",
            "url": "https://github.com/pierrepaap/Jellyby",
            "imagefolder": "https://github.com/pierrepaap/Jellyby/releases/latest/download/",
            "images": [{
              "name": "Jellyby Pi 4 (64-bit)",
              "description": "Ready-to-flash Jellyby image. Boots into the kiosk; SSH enabled (pi / jellyby).",
              "url": "https://github.com/pierrepaap/Jellyby/releases/latest/download/jellyby-pi4.img.xz",
              "image_size": int(size),
              "sha256": sha,
              "release_date": date,
              "devices": ["pi4", "pi400"],
              "os": "Linux",
              "initformat": "auto"
            }]
          }]}
          with open("jellyby-imager.json", "w") as f:
            json.dump(doc, f, indent=2)
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: Jellyby Pi 4 image (run ${{ github.run_number }})
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            jellyby-pi4.img.xz
            jellyby-imager.json
            pinn-out/*
