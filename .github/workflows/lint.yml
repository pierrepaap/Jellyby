name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: sudo bash scripts/ci-apt.sh shellcheck gcc python3

      - name: shellcheck
        run: |
          shellcheck setup.sh scripts/ci-apt.sh scripts/check-image.sh scripts/serve-local.sh scripts/test-image-qemu.sh files/usr/local/bin/readsb-wrapper.sh files/opt/jellyby/kiosk.sh files/opt/jellyby/play.sh files/opt/jellyby/netapply.sh pinn/partition_setup.sh

      - name: cec-kbd build + simulated CEC adapter test
        run: |
          gcc -O2 -Wall -Wextra -Werror -o /tmp/cec-kbd files/opt/jellyby/cec_kbd.c
          gcc -Wall -o /tmp/cec_kbd_sim tests/cec_kbd_sim.c
          /tmp/cec_kbd_sim files/etc/jellyby/cec-keymap.conf

      - name: launcher API tests (fake Jellyfin server)
        run: python3 -m unittest discover -s tests -v

      - name: python syntax check
        run: |
          python3 -m py_compile files/opt/jellyby/server.py
          python3 -m py_compile files/opt/jellyby/resolve_stream.py files/opt/jellyby/mediaclient.py
          python3 -m py_compile scripts/gen-pinn.py tests/test_server.py

      - name: Set up Node (pinned)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: javascript syntax check
        run: node --check files/opt/jellyby/www/app.js

      - name: json check
        run: |
          python3 -m json.tool files/etc/jellyby/apps.json > /dev/null
          python3 -m json.tool files/etc/jellyby/players.json > /dev/null
          python3 -m json.tool imager/jellyby.json > /dev/null
