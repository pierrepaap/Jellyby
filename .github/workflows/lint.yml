name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gcc pkg-config libcec-dev python3

      - name: shellcheck
        run: |
          shellcheck setup.sh scripts/serve-local.sh files/usr/local/bin/readsb-wrapper.sh files/opt/jellyby/kiosk.sh

      - name: cec-kbd syntax check against libcec headers
        run: |
          CEC_CFLAGS="$(pkg-config --cflags libcec 2>/dev/null || true)"
          [[ -n "$CEC_CFLAGS" ]] || CEC_CFLAGS="-I/usr/include/libcec"
          read -r -a CEC_CFLAG_ARGS <<< "$CEC_CFLAGS"
          gcc -fsyntax-only -Wall "${CEC_CFLAG_ARGS[@]}" files/opt/jellyby/cec_kbd.c

      - name: python syntax check
        run: python3 -m py_compile files/opt/jellyby/server.py

      - name: Set up Node (pinned)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: javascript syntax check
        run: node --check files/opt/jellyby/www/app.js

      - name: json check
        run: |
          python3 -m json.tool files/etc/jellyby/apps.json > /dev/null
          python3 -m json.tool imager/jellyby.json > /dev/null
