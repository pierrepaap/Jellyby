# Raspberry Pi 4: vc4-kms-v3d (set in /boot/firmware/config.txt by setup.sh)
# exposes the rpivid V4L2 stateless HEVC decoder (/dev/video10/11). Raspberry
# Pi OS's patched ffmpeg/mpv pick it up via v4l2-request when hwdec=auto-safe
# walks its list (no vaapi/drm hwdec on Pi 4). If not, set
# hwdec=v4l2request explicitly.
hwdec=auto-safe
