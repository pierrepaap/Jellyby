# Raspberry Pi 4: vc4-kms-v3d (set in /boot/firmware/config.txt by setup.sh)
# exposes the rpivid V4L2 stateless HEVC decoder (/dev/video19 on recent
# kernels). Raspberry Pi OS's ffmpeg drives it through the v4l2-request
# hwaccel, which mpv calls "drm". It must be named explicitly: in mpv 0.35
# (Pi OS Bookworm) "auto-safe" never tries drm. H.264 has no such decoder on
# the Pi 4 and decodes in software (fine up to 1080p).
# Check: mpv --msg-level=vd=v <file>  ->  "Using hardware decoding (drm)"
hwdec=drm
