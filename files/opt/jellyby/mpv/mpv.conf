# Jellyby mpv config (shared by all boards).
# The hardware-decode settings are board-specific and live in board.conf,
# which setup.sh installs from board-<board>.conf next to this file.
include="~~/board.conf"
hwdec-codecs=all
vo=gpu
gpu-context=x11
# keep the UI minimal and fullscreen kiosk-style
fullscreen=yes
keep-open=no
osc=no
osd-level=1
profile=fast
# headroom for 1080p/4K HEVC over the network
cache=yes
demuxer-max-bytes=64MiB
