# Jellyby mpv config — Raspberry Pi 4 hardware decode path.
# vc4-kms-v3d (set in /boot/firmware/config.txt by setup.sh) exposes the
# rpivid V4L2 stateless HEVC decoder (/dev/video10/11); mpv picks it up via
# v4l2-request when hwdec=auto-safe walks its list (no vaapi/drm hwdec on Pi 4).
# On a Pi 5 the decoder is rpivid-v4l2 too, but via the pisp/isp pipeline —
# hwdec=auto-safe still finds it; if not, use hwdec=v4l2-request explicitly.
hwdec=auto-safe
hwdec-codecs=all
vo=gpu
gpu-context=x11
# keep the UI minimal and fullscreen kiosk-style
fullscreen=yes
keep-open=no
osc=no
osd-level=1
profile=fast
# Pi 4: 1080p HEVC needs the extra headroom
cache=yes
demuxer-max-bytes=64MiB
