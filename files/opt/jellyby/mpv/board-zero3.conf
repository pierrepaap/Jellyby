# Radxa ZERO 3E/3W (RK3566), Armbian vendor kernel: hardware decode goes
# through Rockchip MPP (/dev/mpp_service). This only works with an mpv linked
# against an MPP-enabled ffmpeg (e.g. ffmpeg-rockchip) — see JELLYBY_MPV_DEBS
# in setup.sh. Debian's stock mpv ignores rkmpp and falls back to software.
# Order: MPP first, then DRM-PRIME/v4l2-request (mainline kernels), then
# mpv's safe defaults.
# UNVERIFIED on hardware: check with `mpv --hwdec=rkmpp --msg-level=vd=v <file>`
# and look for "Using hardware decoding (rkmpp)".
hwdec=rkmpp,drm,auto-safe
