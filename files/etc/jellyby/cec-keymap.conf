# CEC remote button -> key sent to the OS (via /dev/uinput).
#
# Left side: libcec user-control button name (see cec_kbd.c CEC_NAMES).
# Right side: evdev key name, optionally with modifiers, e.g. "ctrl+w",
#             "shift+left". Lines starting with # are ignored.
#
# Edit over SSH, then: sudo systemctl restart cec-kbd

select        = enter
enter         = enter
up            = up
down          = down
left          = left
right         = right
clear         = delete

# back-ish buttons: close the current tab / go back in the launcher
backward      = backspace
an_return     = backspace
exit          = ctrl+w

# menu buttons open the launcher settings (F10)
root_menu     = f10
setup_menu    = f10
contents_menu = f10
top_menu      = f10
dvd_menu      = f10
favorite_menu = f10

channel_up    = pageup
channel_down  = pagedown
page_up       = pageup
page_down     = pagedown

volume_up     = volumeup
volume_down   = volumedown
mute          = mute

play          = space
pause         = space
pause_play_function = space
stop          = s
record        = r
rewind        = shift+left
fast_forward  = shift+right
forward       = shift+right

number0 = 0
number1 = 1
number2 = 2
number3 = 3
number4 = 4
number5 = 5
number6 = 6
number7 = 7
number8 = 8
number9 = 9
dot     = dot

f1_blue   = f1
f2_red    = f2
f3_green  = f3
f4_yellow = f4
f5        = f5

display_information = i
help                = f1

# power is intentionally left unmapped
# power = ...
