# Jellyby (Raspberry Pi 4): default audio output -> HDMI0 (the micro-HDMI port
# next to the USB-C power socket). "hdmi:" wraps the vc4-hdmi card in the
# IEC958 framing it requires; "plug" converts sample rate/format.
# Using the other port? Replace vc4hdmi0 with vc4hdmi1. List cards: aplay -l
pcm.!default {
  type plug
  slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
}
ctl.!default {
  type hw
  card vc4hdmi0
}
